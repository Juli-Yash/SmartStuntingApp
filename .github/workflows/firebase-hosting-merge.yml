# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # Mengambil kode dari repository Anda
      - uses: actions/checkout@v4

      # Menginstal Flutter SDK di server
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Menginstal dependencies Flutter
      - name: Install Dependencies
        run: flutter pub get

      # Mem-build aplikasi Flutter untuk web
      - name: Build Flutter Web
        run: flutter build web

      # Men-deploy hasil build ke Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMARTSTUNTING_2025 }}
          channelId: live
          projectId: smartstunting-2025